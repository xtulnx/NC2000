name: Android release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Each job receives only the permission it needs.
permissions: {}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APKs
    runs-on: ubuntu-latest
    # Create this protected environment in GitHub and keep all signing secrets there.
    environment: android-release
    permissions:
      contents: read

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the pinned NDK and CMake
        run: sdkmanager --install "ndk;30.0.15729638" "cmake;4.1.2"

      - name: Restore the signing key only on this ephemeral runner
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          key_store="$RUNNER_TEMP/android-release.keystore"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_store"
          test -s "$key_store"
          printf 'SIGNING_STORE_FILE=%s\n' "$key_store" >> "$GITHUB_ENV"

      - name: Build ABI-specific and universal release APKs
        working-directory: android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version_name="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="$version_name" \
            -PversionCode="${{ github.run_number }}"

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: NC2000-Android-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/*-x86_64-release.apk
            android/app/build/outputs/apk/release/*-universal-release.apk

      - name: Delete the temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/android-release.keystore"

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: NC2000-Android-${{ github.ref_name }}
          path: release-apks

      - name: Attach APKs to the matching GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
          generate_release_notes: true
